name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Gemini is mocked and the database is in-memory, so no secrets are needed
      - name: Build and run tests
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Builds the image and starts the app with PostgreSQL, without a Gemini key
      - name: Start app and database
        run: docker compose up --build -d
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "App is up"; exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Check sample data and API docs
        run: |
          curl -fs http://localhost:8080/api/batches | grep -q "Sample dataset (50 reviews)"
          curl -fs http://localhost:8080/v3/api-docs | grep -q "Retail Feedback Insights API"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
