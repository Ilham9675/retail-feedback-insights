spring.application.name=retail-feedback-insights

# Server port
server.port=${PORT:8080}

# Input files (relative to the repository root)
# Sentiment analysis output produced by the sentiment-core module
feedback.input-file=${FEEDBACK_INPUT_FILE:data/sentiment_feedback_output.txt}
# Raw dataset; its "Feedback #n [LABEL]" headers are used to evaluate sentiment accuracy
feedback.labels-file=${FEEDBACK_LABELS_FILE:data/store_feedback.txt}

# Reviews per Gemini request
feedback.ai.batch-size=${FEEDBACK_AI_BATCH_SIZE:25}

# Spring AI - Google Gemini
# The key is read from the GEMINI_API_KEY environment variable so it is never stored in this file or pushed to GitHub.
# The placeholder only lets the app start without a key; Gemini calls then fail and reviews stay "Uncategorized".
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-set}
# gemini-1.5-flash and gemini-2.5-flash are no longer offered to new keys; the "latest" alias follows Google's current lite model
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-flash-lite-latest}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.max-output-tokens=8192
# Only the chat model is used
spring.ai.model.embedding=none

# Logging configuration
logging.level.com.retailstore=DEBUG
logging.level.org.springframework.web=INFO

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
